[project]
name = "yertle"
version = "0.1.0"
description = "Python ecosystem for Yertle — CLI, SDK, and tooling for the Yertle architecture-graph platform."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Yertle" }]
keywords = ["yertle", "architecture", "cli", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "yertle-client>=0.1.0",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.7"]
sre = [
    "langchain>=1.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "yertle[cli]",
]
mcp = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.7",
]

[project.scripts]
yertle = "yertle.cli.main:app"
yertle-sre = "yertle.sre.cli:app"
yertle-mcp = "yertle.mcp.server:main"

[project.urls]
Homepage = "https://github.com/model-context/yertle-python"
Repository = "https://github.com/model-context/yertle-python"
Issues = "https://github.com/model-context/yertle-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yertle"]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PL",            # pylint subset
    "TID",           # tidy imports
    "ANN",           # annotations
]
ignore = [
    "PLR0913",  # too many arguments — common in CLI command signatures
    "ANN401",   # Any is sometimes correct
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pyright: type checking
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Typer's Option/Argument overloads return `Any`, which trips strict-mode
# reportUnknownMemberType / reportUnknownVariableType on every CLI command.
# Same pragmatic loosening yertle-sre uses for LangChain interop.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportDeprecated = false             # noisy from upstream LangChain **deprecated_kwargs

executionEnvironments = [
    # `reportFunctionMemberAccess = "none"`: LangChain's `@tool` decorator
    # attaches methods (.invoke, .run, .ainvoke, etc.) that pyright can't see
    # under Python 3.11 + langchain-core's older type stubs — the return type
    # narrows to `FunctionType` from pyright's perspective. Runtime behavior
    # is correct; the methods do exist. Locally on Python 3.14 pyright resolves
    # them fine, but CI runs 3.11 and hits the mismatch. Test-only loosening.
    #
    # `reportPrivateUsage = "none"`: tests exercise module-private helpers
    # (e.g. `_mask_token`) directly. Testing them through the public CLI
    # surface alone would leave their edge cases uncovered.
    { root = "tests", reportMissingParameterType = "none", reportUnknownParameterType = "none", reportUnknownLambdaType = "none", reportFunctionMemberAccess = "none", reportPrivateUsage = "none" },
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
