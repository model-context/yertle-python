[project]
name = "yertle"
version = "0.0.1"
description = "Python ecosystem for Yertle — CLI, SDK, and tooling for the Yertle architecture-graph platform."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Yertle" }]
keywords = ["yertle", "architecture", "cli", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "yertle-client>=0.1.0",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.7"]
sre = [
    "langchain>=1.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "yertle[cli]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.7",
]

[project.scripts]
yertle = "yertle.cli.main:app"
yertle-sre = "yertle.sre.cli:app"

[project.urls]
Homepage = "https://github.com/model-context/yertle-python"
Repository = "https://github.com/model-context/yertle-python"
Issues = "https://github.com/model-context/yertle-python/issues"

# Path dep during development — consumes the in-progress yertle-client package
# from the sibling backend repo. Switched to a PyPI version dep once yertle-client
# is published (after PAT auth slice lands).
[tool.uv.sources]
yertle-client = { path = "../yertle/clients/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yertle"]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PL",            # pylint subset
    "TID",           # tidy imports
    "ANN",           # annotations
]
ignore = [
    "PLR0913",  # too many arguments — common in CLI command signatures
    "ANN401",   # Any is sometimes correct
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pyright: type checking
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Typer's Option/Argument overloads return `Any`, which trips strict-mode
# reportUnknownMemberType / reportUnknownVariableType on every CLI command.
# Same pragmatic loosening yertle-sre uses for LangChain interop.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportDeprecated = false             # noisy from upstream LangChain **deprecated_kwargs

executionEnvironments = [
    { root = "tests", reportMissingParameterType = "none", reportUnknownParameterType = "none", reportUnknownLambdaType = "none" },
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
