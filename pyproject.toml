[project]
name = "yertle"
version = "0.2.0"
description = "Python ecosystem for Yertle — CLI, SDK, and tooling for the Yertle architecture-graph platform."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Yertle" }]
keywords = ["yertle", "architecture", "cli", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "yertle-client>=0.2.0",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.7"]
sre = [
    "langchain>=1.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "yertle[cli]",
]
mcp = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "diff-cover>=9.0",
    # Pinned exactly, not floored: ruff's formatter output and lint rule set
    # both change across minor versions, so a range lets a contributor's
    # pre-commit format code that CI's ruff then rejects. The `rev` in
    # .pre-commit-config.yaml must be bumped in lockstep with this pin.
    "ruff==0.15.13",
    "pyright>=1.1.380",
    "pre-commit>=3.7",
    "vulture>=2.11",
]

[project.scripts]
yertle = "yertle.cli.main:app"
yertle-sre = "yertle.sre.cli:app"
yertle-mcp = "yertle.mcp.server:main"

[project.urls]
Homepage = "https://github.com/model-context/yertle-python"
Repository = "https://github.com/model-context/yertle-python"
Issues = "https://github.com/model-context/yertle-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yertle"]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PL",            # pylint subset
    "TID",           # tidy imports
    "ANN",           # annotations
    "ARG",           # unused arguments — dead code ruff's F rules don't reach
    "BLE",           # blind except — the error-masking failure mode
    "TRY",           # exception antipatterns
    "C90",           # mccabe complexity ceiling
    "ERA",           # commented-out code
]
ignore = [
    "PLR0913",  # too many arguments — common in CLI command signatures
    "ANN401",   # Any is sometimes correct
    # TRY003 bans long messages at the `raise` site. This package deliberately
    # does the opposite: an exception's message IS the user-facing text (see
    # `AuthError` in shared/auth.py), so the message belongs where the context
    # to write it lives.
    "TRY003",
    # TRY004 wants TypeError for isinstance checks. The isinstance guards in the
    # SDK resources validate an unexpected *wire response shape*, not a caller's
    # argument type — RuntimeError is the correct signal there.
    "TRY004",
]

[tool.ruff.lint.mccabe]
# Deliberately tight. The most complex function in the tree today is well
# under this; the ceiling exists to catch accreted branching before it lands,
# which is the shape unreviewed generated code tends to grow.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# ARG: pytest fixtures are requested by name and often unused in the body
# (autouse fixtures especially) — the "argument" is a dependency declaration.
"tests/**" = ["ANN", "PLR2004", "ARG"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pyright: type checking
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Typer's Option/Argument overloads return `Any`, which trips strict-mode
# reportUnknownMemberType / reportUnknownVariableType on every CLI command.
# Same pragmatic loosening yertle-sre uses for LangChain interop.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportDeprecated = false             # noisy from upstream LangChain **deprecated_kwargs

executionEnvironments = [
    # `reportFunctionMemberAccess = "none"`: LangChain's `@tool` decorator
    # attaches methods (.invoke, .run, .ainvoke, etc.) that pyright can't see
    # under Python 3.11 + langchain-core's older type stubs — the return type
    # narrows to `FunctionType` from pyright's perspective. Runtime behavior
    # is correct; the methods do exist. Locally on Python 3.14 pyright resolves
    # them fine, but CI runs 3.11 and hits the mismatch. Test-only loosening.
    #
    # `reportPrivateUsage = "none"`: tests exercise module-private helpers
    # (e.g. `_mask_token`, `_source_checkout`) directly, since their edge
    # cases are not all reachable through the public CLI surface.
    { root = "tests", reportMissingParameterType = "none", reportUnknownParameterType = "none", reportUnknownLambdaType = "none", reportFunctionMemberAccess = "none", reportPrivateUsage = "none" },
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
# The gate in CI is *diff* coverage, not total coverage: `diff-cover` reads this
# XML report and fails only when lines added or changed by the PR are untested.
# A total-coverage floor punishes unrelated work and invites gaming; a diff
# floor asks exactly one thing — test what you just wrote.
[tool.coverage.run]
source = ["src/yertle"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
]

# ---------------------------------------------------------------------------
# Vulture: dead-code detection (advisory — see the `hygiene` make target)
# ---------------------------------------------------------------------------
# Covers what ruff and pyright structurally cannot: unused *public* functions
# and whole unreferenced modules. Because this is a published library, most of
# the public surface has no in-repo caller by design, so framework-registered
# and re-exported names are ignored below. Anything left is worth a look.
[tool.vulture]
paths = ["src"]
min_confidence = 60
# Decorator registration makes a function reachable without a call site.
ignore_decorators = [
    "@app.command",
    "@app.callback",
    "@auth_app.command",
    "@tool",
]
ignore_names = [
    # pydantic-settings reads this class attribute reflectively.
    "model_config",
    # Documented in agent.py as wired-but-unused, pending the first mutating
    # tool. Intentional, not drift.
    "allow_writes",
]
