# The `rev` here must match the exact `ruff==` pin in pyproject.toml's dev
# extra. If they drift, pre-commit can format code that CI's ruff rejects.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
